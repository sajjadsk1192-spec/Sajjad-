name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Install Android 36 SDK platform and accept licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          (yes || true) | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || \
            sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          (yes || true) | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Create temporary .env from GitHub Secrets (if configured)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if [ -n "$ADMIN_EMAIL" ]; then
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL" > .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: >
          gradle assembleDebug
          --no-daemon
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-lucky-draw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
